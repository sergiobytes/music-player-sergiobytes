<!doctype html>
<html lang="es" data-theme="atardecer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rola</title>
    <!-- Aplica el tema guardado antes de pintar la página (evita el parpadeo) -->
    <script>
      try {
        const t = localStorage.getItem("rola-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="h-dvh bg-canvas font-sans text-[15px] text-fg antialiased">
    <div class="grid h-dvh grid-rows-[auto_1fr_auto]">
      <!-- Encabezado -->
      <header
        class="flex flex-wrap items-center gap-3 border-b border-line px-4 py-3 md:gap-4 md:px-5"
      >
        <div
          class="bg-gradient-to-r from-accent to-accent2 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent"
        >
          Rola
        </div>

        <form id="addForm" class="flex min-w-64 flex-1 gap-2">
          <textarea
            id="links"
            rows="1"
            class="h-11 flex-1 resize-none rounded-xl border border-line bg-panel2 px-3 py-2.5 text-fg placeholder:text-muted focus:border-transparent focus:outline-2 focus:outline-accent"
            placeholder="Pega uno o varios enlaces de YouTube y presiona Enter"
          ></textarea>
          <button
            type="submit"
            class="cursor-pointer rounded-xl bg-accent px-4 font-bold whitespace-nowrap text-on-accent transition hover:brightness-110"
          >
            Agregar
          </button>
        </form>

        <!-- Selector de tema -->
        <div class="relative">
          <button
            id="themeBtn"
            type="button"
            title="Cambiar tema"
            aria-haspopup="true"
            aria-expanded="false"
            class="grid size-11 cursor-pointer place-items-center rounded-xl border border-line bg-panel2 text-muted transition hover:text-fg"
          >
            <svg viewBox="0 0 24 24" class="size-5 fill-current">
              <path
                d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.240 5-5 0-4.42-4.03-8-9-8Zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"
              />
            </svg>
          </button>
          <div
            id="themeMenu"
            role="menu"
            class="absolute top-full right-0 z-20 mt-2 hidden w-52 rounded-xl border border-line bg-panel p-1.5 shadow-2xl"
          ></div>
        </div>

        <div id="msg" class="min-h-4 w-full text-[13px] text-muted"></div>
      </header>

      <!-- Contenido -->
      <main
        class="grid overflow-hidden max-md:grid-rows-[auto_1fr] md:grid-cols-[1fr_340px]"
      >
        <section class="overflow-y-auto p-3 pb-6">
          <div class="flex items-center justify-between px-2 pt-1.5 pb-3">
            <h2 class="text-lg font-bold">Lista de reproducción</h2>
            <button
              id="clearBtn"
              class="cursor-pointer rounded-lg px-2.5 py-1.5 text-[13px] text-muted hover:bg-panel2 hover:text-fg"
            >
              Vaciar lista
            </button>
          </div>
          <ol id="list"></ol>
          <div
            id="empty"
            class="px-5 py-16 text-center leading-relaxed text-muted"
          >
            Tu lista está vacía.<br />
            Pega enlaces de YouTube arriba: se van sumando a la cola sin
            interrumpir lo que está sonando.
          </div>
        </section>

        <aside
          class="flex gap-3.5 overflow-y-auto border-line p-5 max-md:order-first max-md:items-center max-md:border-b max-md:px-4 max-md:py-3 md:flex-col md:border-l"
        >
          <div
            class="aspect-video w-full overflow-hidden rounded-xl bg-black max-md:size-50 max-md:flex-none md:min-h-50"
          >
            <div id="yt"></div>
          </div>
          <div>
            <div class="text-xs tracking-widest text-muted uppercase">
              Sonando ahora
            </div>
            <div id="npTitle" class="text-[17px] leading-snug font-bold">—</div>
            <div id="upNext" class="mt-1 text-[13px] text-muted"></div>
          </div>
        </aside>
      </main>

      <!-- Barra del reproductor -->
      <footer
        class="grid items-center gap-4 border-t border-line bg-panel px-4 py-2.5 md:grid-cols-[1fr_2fr_1fr] md:px-5"
      >
        <div id="ftTitle" class="truncate text-sm max-md:hidden"></div>

        <div class="flex flex-col items-center gap-1.5">
          <div class="flex items-center gap-2.5">
            <button class="ctrl cursor-pointer" id="shufBtn" title="Aleatorio">
              <svg viewBox="0 0 24 24">
                <path
                  d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"
                />
              </svg>
            </button>
            <button
              class="ctrl cursor-pointer"
              id="prevBtn"
              title="Anterior (Shift + ←)"
            >
              <svg viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
              </svg>
            </button>
            <button
              id="playBtn"
              title="Reproducir / Pausa (espacio)"
              class="grid size-11 cursor-pointer place-items-center rounded-full bg-fg text-canvas transition hover:scale-105"
            >
              <svg
                viewBox="0 0 24 24"
                id="playIcon"
                class="size-5 fill-current"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
            <button
              class="ctrl cursor-pointer"
              id="nextBtn"
              title="Siguiente (Shift + →)"
            >
              <svg viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
              </svg>
            </button>
            <button
              class="ctrl relative cursor-pointer"
              id="repBtn"
              title="Repetir"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"
                />
              </svg>
            </button>
          </div>
          <div
            class="flex w-full items-center gap-2.5 text-xs text-muted tabular-nums"
          >
            <span id="cur">0:00</span>
            <input
              type="range"
              id="seek"
              min="0"
              max="1000"
              value="0"
              class="range"
            />
            <span id="dur">0:00</span>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 max-md:hidden">
          <svg viewBox="0 0 24 24" class="size-4.5 fill-muted">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"
            />
          </svg>
          <input
            type="range"
            id="vol"
            min="0"
            max="100"
            value="80"
            class="range max-w-30"
          />
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
